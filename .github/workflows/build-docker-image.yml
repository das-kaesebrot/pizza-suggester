name: Build a docker image for testing purposes

on:
  pull_request:
    branches:
      - master
    paths:
      - '**.py'
      - '.github/workflows/build-and-publish.yml'
      - '**.java'
      - '**.properties'
      - '*.gradle'
      - 'Dockerfile'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGENAME }}
          github-token: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ vars.DOCKERHUB_IMAGENAME }}:latest
            ${{ vars.DOCKERHUB_IMAGENAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
